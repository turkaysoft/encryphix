tsp_file_not_found = निर्दिष्ट फ़ाइल नहीं मिल सकी।
tsp_corrupted_file_or_tampered = फ़ाइल दूषित हो सकती है या उससे छेड़छाड़ की गई हो सकती है। डेटा अखंडता की पुष्टि नहीं की जा सकी।
