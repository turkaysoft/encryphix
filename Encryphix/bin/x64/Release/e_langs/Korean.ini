[TSProtection]
tsp_folder_encryption_error = 폴더를 암호화하는 동안 예기치 않은 오류가 발생했습니다. 다시 시도해 주세요.
tsp_salt_read_error = 파일에서 솔트 데이터를 읽지 못했습니다. 파일이 손상되었을 수 있습니다.
tsp_file_type_read_error = 파일 유형 정보를 읽지 못했습니다. 파일이 손상되지 않았는지 확인해 주세요.
tsp_ext_length_read_error = 파일 확장자 길이를 읽지 못했습니다. 파일이 손상되지 않았는지 확인해 주세요.
tsp_invalid_extension_length_error = 파일 확장자 길이가 올바르지 않거나 손상되었습니다.
tsp_extension_read_error = 파일 확장자를 읽지 못했습니다. 파일이 손상되지 않았는지 확인해 주세요.
tsp_iv_read_error = 파일에서 IV 데이터를 읽지 못했습니다. 파일의 무결성을 확인해 주세요.
tsp_invalid_password_or_corrupt_file = 입력한 비밀번호가 틀렸거나 파일이 손상되었습니다. 비밀번호와 파일 무결성을 확인해 주세요.
tsp_access_error = 파일 또는 폴더에 접근할 수 있는 권한이 없습니다. 권한을 확인하거나 관리자 권한으로 다시 시도해 주세요.
tsp_unknown_error = 알 수 없는 오류가 발생했습니다. 작업을 다시 시도해 주세요.
tsp_invalid_folder_path = 폴더 경로가 비어 있거나 올바르지 않습니다.
tsp_invalid_password = 비밀번호가 비어 있거나 올바르지 않습니다.
tsp_folder_not_found = 지정된 폴더를 찾을 수 없습니다.
tsp_invalid_input_file = 입력 파일 경로가 비어 있거나 올바르지 않습니다.
tsp_invalid_output_file = 출력 파일 경로가 비어 있거나 올바르지 않습니다.
tsp_file_not_found = 지정된 파일을 찾을 수 없습니다.
tsp_corrupted_file_or_tampered = 파일이 손상되었거나 변조되었을 수 있습니다. 데이터 무결성을 확인할 수 없습니다.
tsp_hmac_read_error = 암호화된 파일의 무결성 검증 데이터를 읽을 수 없습니다.
tsp_invalid_session = 암호화 세션이 유효하지 않거나 비어 있습니다.
tsp_invalid_path = 파일 또는 폴더 경로는 비어 있을 수 없습니다.
tsp_invalid_directory = 디렉터리 경로가 유효하지 않습니다.

